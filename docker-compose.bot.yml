services:
  monitoring-bot:
    image: monitoring-bot:debian-amd64
    pull_policy: never
    container_name: monitoring-bot
    restart: unless-stopped
    mem_limit: ${MONITOR_CONTAINER_MEMORY_LIMIT:-192m}
    cpus: ${MONITOR_CONTAINER_CPU_LIMIT:-0.5}
    pids_limit: ${MONITOR_CONTAINER_PIDS_LIMIT:-64}
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /:/hostfs:ro
